server:
  port: 8080

spring:
  application:
    name: agente-bancario
  datasource:
    url: jdbc:h2:mem:bancodemo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
      path: /h2-console

banco:
  use-llm-stub: true
  internal-bank-mode: INTERNAL_BANK_MODE
  admin-escalation-flag: ADMIN_ESCALATION

logging:
  level:
    root: INFO
    br.hackathon.banco: DEBUG
